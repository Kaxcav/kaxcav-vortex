name: CI

on:
  push:
    branches: [main, motor-superior]
  pull_request:

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ['22', '24', '26']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Node and SQLite
        run: node -e "const s=require('node:sqlite');console.log(process.version, typeof s.DatabaseSync)"
      - name: Tests
        run: npm test
